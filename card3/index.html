<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Gandhi Era Begins (1915)</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="data.js"></script>
</head>
<body class="lang-ta">

  <!-- Top Controls Overlay -->
  <div class="top-controls">
    <div class="right-controls">
      <button class="btn-control btn-voice" id="btn-voice" style="display: none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        <span id="voice-text">Voice</span>
      </button>
      <button class="btn-control btn-lang" id="btn-lang">தமிழ்</button>
    </div>
  </div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top-controls">
      <a href="../index.html" class="btn-control btn-back sidebar-back" style="width: 100%;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg> பின்செல்
      </a>
    </div>
    <button class="sidebar-btn active" id="btn-nav-video">Intro Video</button>
    <button class="sidebar-btn" id="btn-nav-timeline">Timeline</button>
    <button class="sidebar-btn" id="btn-nav-associates">Associates</button>
  </aside>
  
  <button class="btn-sidebar-toggle" id="btn-sidebar-toggle">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
  </button>

  <!-- Main Content Area -->
  <main class="main-content">
    
    <!-- Video Section -->
    <section id="section-video" class="content-section active">
      <div id="slideshow-container" class="slideshow-container">
        <!-- Frames will be injected here -->
      </div>
      <div id="slideshow-text-overlay" class="slideshow-text-overlay hidden">
        <h2 id="slideshow-heading"></h2>
        <p id="slideshow-text"></p>
      </div>
      <div class="video-overlay" id="video-overlay">
        <button class="btn-play" id="btn-play-video">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <p id="play-text">Click to Play</p>
      </div>
    </section>

    <!-- Timeline Section -->
    <section id="section-timeline" class="content-section">
      <div id="timeline-bg" class="section-dynamic-bg"></div>
      <h1 class="section-title" id="timeline-title">Timeline</h1>
      <div class="timeline-container" id="timeline-container">
        <!-- Timeline items will be injected here -->
      </div>
    </section>

    <!-- Associates Section -->
    <section id="section-associates" class="content-section">
      <h1 class="section-title" id="associates-title">Associates</h1>
      <div class="associates-container" id="associates-container">
        <!-- Associates cards will be injected here -->
      </div>
    </section>

  </main>

  <!-- Hidden Audio for TTS -->
  <audio id="tts-audio"></audio>

  <script src="../kiosk-idle.js"></script>
  <script src="script.js"></script>
</body>
</html>
