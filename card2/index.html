<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voices of Indian Renaissance (1800)</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>


  <main class="split-layout">
    <!-- Left sidebar: portrait list (first 3) -->
    <aside class="sidebar-left">
      <div class="sidebar-header control-square">
        <a href="../index.html" class="btn-back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          <span id="back-text">Back</span>
        </a>
      </div>
      <div class="portrait-list" id="portrait-list-left"></div>
    </aside>

    <!-- Center content area -->
    <section class="content-center" id="content-center">
      <h1 class="main-page-title" id="main-page-title">Voices of Renaissance</h1>
      <!-- Welcome screen -->
      <div id="welcome-placeholder" class="welcome-placeholder">
        <h2>Select a Reformer</h2>
        <p>Click on a portrait to explore their life and legacy.</p>
      </div>

      <!-- Grid container: holds image, grid lines overlay, and flip cells -->
      <div id="grid-container" class="grid-container hidden">
        <!-- 10x10 grid of flip cells -->
        <div id="flip-grid" class="flip-grid"></div>
        <!-- Grid lines overlay (drawn on top of the image) -->
        <div id="grid-lines-overlay" class="grid-lines-overlay"></div>
        <!-- Scrollable content that appears after flip -->
        <div id="scrollable-content" class="scrollable-content hidden"></div>
      </div>
    </section>

    <!-- Right sidebar: portrait list (last 3) -->
    <aside class="sidebar-right">
      <div class="sidebar-header control-square">
        <button class="btn-control" id="btn-lang" title="Toggle Language">
          <span id="lang-text">ENGLISH</span>
        </button>
        <button class="btn-control" id="btn-voice" title="Toggle Voice">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          Voice
        </button>
      </div>
      <div class="portrait-list" id="portrait-list-right"></div>
    </aside>
  </main>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
